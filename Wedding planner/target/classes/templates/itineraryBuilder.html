<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Itinerary Builder</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="/itinerary">Wedding Planner - Component 4</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/guests">Guest Manager</a>
        </div>
    </div>
</nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Itinerary Timeline Builder</h2>
    </div>

    <!-- Form to Add Event -->
    <div class="card mb-4 shadow-sm border-info">
        <div class="card-header bg-info text-dark fw-bold">
            Add New Timeline Event
        </div>
        <div class="card-body">
            <form th:action="@{/itinerary/add}" method="post" class="row g-3 align-items-end">
                <div class="col-md-2">
                    <label class="form-label small text-muted">User ID</label>
                    <input type="text" class="form-control" name="userId" placeholder="e.g. USR-1" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label small text-muted">Event Name</label>
                    <input type="text" class="form-control" name="eventName" placeholder="e.g. Reception" required>
                </div>
                <div class="col-md-2">
                    <label class="form-label small text-muted">Date</label>
                    <input type="date" class="form-control" name="eventDate" required>
                </div>
                <div class="col-md-2">
                    <label class="form-label small text-muted">Time</label>
                    <input type="time" class="form-control" name="time" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label small text-muted">Description</label>
                    <input type="text" class="form-control" name="description" placeholder="Brief details..." required>
                </div>
                <div class="col-12 mt-3">
                    <button type="submit" class="btn btn-info fw-bold w-100 text-dark shadow-sm">Save Timeline Event</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Event Timeline Table -->
    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <table class="table table-striped table-hover mb-0">
                <thead class="table-dark">
                    <tr>
                        <th>Itinerary ID</th>
                        <th>User ID</th>
                        <th>Event Name</th>
                        <th>Date & Time</th>
                        <th>Description</th>
                        <th class="text-center">Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${itineraries.empty}">
                        <td colspan="6" class="text-center text-muted py-4">No events in the itinerary yet. Start building your timeline!</td>
                    </tr>
                    <!-- Loop through Collections ArrayList -->
                    <tr th:each="event : ${itineraries}">
                        <td th:text="${event.itineraryId}" class="fw-bold"></td>
                        <td><span class="badge bg-secondary" th:text="${event.userId}"></span></td>
                        <td th:text="${event.eventName}" class="fw-bold text-primary"></td>
                        <td th:text="${event.eventDate + ' @ ' + event.time}"></td>
                        <td th:text="${event.description}"></td>
                        <td class="text-center">
                            <a th:href="@{/itinerary/delete/{id}(id=${event.itineraryId})}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Delete this event?');">Remove</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
