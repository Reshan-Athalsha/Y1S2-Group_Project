<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Vendor Ratings & Reviews</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons for stars -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="/reviews">Wedding Planner - Component 5</a>
    </div>
</nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Vendor Reviews & Ratings</h2>
        <a href="/reviews/add" class="btn btn-primary shadow-sm fw-bold">Leave a Review</a>
    </div>

    <!-- Collections Table -->
    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <table class="table table-striped table-hover mb-0">
                <thead class="table-dark">
                    <tr>
                        <th>Review ID</th>
                        <th>User ID</th>
                        <th>Vendor ID</th>
                        <th>Rating</th>
                        <th>Comment</th>
                        <th>Date</th>
                        <th class="text-center">Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${reviews.empty}">
                        <td colspan="7" class="text-center text-muted py-4">No reviews yet. Be the first to leave one!</td>
                    </tr>
                    <tr th:each="review : ${reviews}">
                        <td th:text="${review.reviewId}" class="fw-bold"></td>
                        <td><span class="badge bg-secondary" th:text="${review.userId}"></span></td>
                        <td><span class="badge bg-info text-dark" th:text="${review.vendorId}"></span></td>
                        <td>
                            <span class="text-warning fw-bold fs-5">
                                <span th:text="${review.rating}"></span> <i class="bi bi-star-fill"></i>
                            </span>
                        </td>
                        <td th:text="${review.comment}" class="fst-italic text-secondary"></td>
                        <td th:text="${review.date}"></td>
                        <td class="text-center">
                            <a th:href="@{/reviews/delete/{id}(id=${review.reviewId})}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Permanently delete this review?');">Delete</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
