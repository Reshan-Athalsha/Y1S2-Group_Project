<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Vendor Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="#">Wedding Planner - Component 2</a>
    </div>
</nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Vendor Management Dashboard</h2>
        <a href="/vendors/add" class="btn btn-primary shadow-sm">Add New Vendor</a>
    </div>
    
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover table-striped mb-0">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Business Name</th>
                        <th>Category</th>
                        <th>Price</th>
                        <th class="text-center">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Check if vendors list is empty -->
                    <tr th:if="${vendors.empty}">
                        <td colspan="7" class="text-center py-4 text-muted">No vendors found. Click 'Add New Vendor' to get started.</td>
                    </tr>
                    
                    <!-- Loop through vendors ArrayList -->
                    <tr th:each="vendor : ${vendors}">
                        <td th:text="${vendor.userId}" class="fw-bold"></td>
                        <td th:text="${vendor.name}"></td>
                        <td th:text="${vendor.email}"></td>
                        <td th:text="${vendor.businessName}"></td>
                        <td><span class="badge bg-secondary" th:text="${vendor.category}"></span></td>
                        <td th:text="${'$' + vendor.price}"></td>
                        <td class="text-center">
                            <a th:href="@{/vendors/edit/{id}(id=${vendor.userId})}" class="btn btn-sm btn-warning me-2">Edit</a>
                            <a th:href="@{/vendors/delete/{id}(id=${vendor.userId})}" class="btn btn-sm btn-danger" onclick="return confirm('Are you sure you want to delete this vendor? This cannot be undone.')">Delete</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
