<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin Master Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold text-warning" href="/admin/dashboard"><i class="bi bi-shield-lock-fill"></i> System Admin Dashboard</a>
    </div>
</nav>

<div class="container-fluid px-4">
    <h3 class="mb-4 fw-bold text-secondary">Cross-File Analytics & Operations</h3>
    
    <!-- Top Analytics KPI Cards -->
    <div class="row mb-5">
        <!-- Users Metric -->
        <div class="col-xl-3 col-md-6 mb-4">
            <div class="card border-start border-4 border-primary shadow-sm h-100 py-2">
                <div class="card-body">
                    <div class="row no-gutters align-items-center">
                        <div class="col mr-2">
                            <div class="text-xs fw-bold text-primary text-uppercase mb-1">Total Users</div>
                            <div class="h2 mb-0 fw-bold text-dark" th:text="${totalUsers}"></div>
                        </div>
                        <div class="col-auto"><i class="bi bi-people-fill fs-1 text-secondary opacity-25"></i></div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Vendors Metric -->
        <div class="col-xl-3 col-md-6 mb-4">
            <div class="card border-start border-4 border-success shadow-sm h-100 py-2">
                <div class="card-body">
                    <div class="row no-gutters align-items-center">
                        <div class="col mr-2">
                            <div class="text-xs fw-bold text-success text-uppercase mb-1">Registered Vendors</div>
                            <div class="h2 mb-0 fw-bold text-dark" th:text="${totalVendors}"></div>
                        </div>
                        <div class="col-auto"><i class="bi bi-shop fs-1 text-secondary opacity-25"></i></div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Total Bookings Metric -->
        <div class="col-xl-3 col-md-6 mb-4">
            <div class="card border-start border-4 border-info shadow-sm h-100 py-2">
                <div class="card-body">
                    <div class="row no-gutters align-items-center">
                        <div class="col mr-2">
                            <div class="text-xs fw-bold text-info text-uppercase mb-1">Total Bookings</div>
                            <div class="h2 mb-0 fw-bold text-dark" th:text="${totalBookings}"></div>
                        </div>
                        <div class="col-auto"><i class="bi bi-calendar-check-fill fs-1 text-secondary opacity-25"></i></div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Pending Bookings Metric -->
        <div class="col-xl-3 col-md-6 mb-4">
            <div class="card border-start border-4 border-warning shadow-sm h-100 py-2">
                <div class="card-body">
                    <div class="row no-gutters align-items-center">
                        <div class="col mr-2">
                            <div class="text-xs fw-bold text-warning text-uppercase mb-1">Pending Bookings</div>
                            <div class="h2 mb-0 fw-bold text-dark" th:text="${pendingBookings}"></div>
                        </div>
                        <div class="col-auto"><i class="bi bi-hourglass-split fs-1 text-secondary opacity-25"></i></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Master Control Lists -->
    <div class="row">
        
        <!-- Users Master Table -->
        <div class="col-lg-6 mb-4">
            <div class="card shadow-sm border-0 h-100">
                <div class="card-header bg-dark text-white fw-bold d-flex justify-content-between align-items-center">
                    <span>Master User Directory</span>
                    <span class="badge bg-primary rounded-pill px-3 py-2" th:text="${totalUsers} + ' Accounts'"></span>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover table-striped mb-0">
                            <thead class="table-light text-uppercase small">
                                <tr>
                                    <th>ID</th>
                                    <th>Full Name</th>
                                    <th>Email Address</th>
                                    <th>Role</th>
                                    <th class="text-center">Admin Privilege</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="user : ${users}">
                                    <td class="fw-bold" th:text="${user[0]}"></td>
                                    <td th:text="${user[1]}"></td>
                                    <td th:text="${user[2]}"></td>
                                    <td><span class="badge bg-secondary" th:text="${user[4]}"></span></td>
                                    <td class="text-center">
                                        <!-- ADMIN PRIVILEGE: Delete User completely -->
                                        <a th:href="@{/admin/deleteUser/{id}(id=${user[0]})}" class="btn btn-sm btn-danger fw-bold shadow-sm" onclick="return confirm('WARNING: Are you absolutely sure you want to permanently delete this user from the system directory?');"><i class="bi bi-trash3-fill"></i> Delete User</a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <!-- Vendors Master Table -->
        <div class="col-lg-6 mb-4">
            <div class="card shadow-sm border-0 h-100">
                <div class="card-header bg-success text-white fw-bold d-flex justify-content-between align-items-center">
                    <span>Master Vendor Registry</span>
                    <span class="badge bg-light text-success rounded-pill px-3 py-2" th:text="${totalVendors} + ' Partners'"></span>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover table-striped mb-0">
                            <thead class="table-light text-uppercase small">
                                <tr>
                                    <th>ID</th>
                                    <th>Business Name</th>
                                    <th>Category</th>
                                    <th>Rating</th>
                                    <th class="text-center">Admin Privilege</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="vendor : ${vendors}">
                                    <td class="fw-bold text-success" th:text="${vendor.userId}"></td>
                                    <td th:text="${vendor.businessName}"></td>
                                    <td><span class="badge bg-info text-dark" th:text="${vendor.category}"></span></td>
                                    <td class="fw-bold text-warning" th:text="${vendor.rating} + ' / 5.0'"></td>
                                    <td class="text-center">
                                        <!-- Uses VendorController's existing delete route -->
                                        <a th:href="@{/vendors/delete/{id}(id=${vendor.userId})}" class="btn btn-sm btn-outline-danger fw-bold" onclick="return confirm('Revoke this vendor from the platform?');"><i class="bi bi-x-circle-fill"></i> Revoke</a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
        
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
