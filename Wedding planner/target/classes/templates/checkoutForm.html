<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Secure Payment Checkout</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="/bookings">Wedding Planner - Checkout</a>
    </div>
</nav>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-success">
                <div class="card-header bg-success text-white d-flex align-items-center">
                    <h4 class="mb-0">Secure Payment Checkout</h4>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/payments/process}" th:object="${payment}" method="post">
                        
                        <!-- COMPOSITION: Payment strictly references Booking ID -->
                        <div class="mb-4">
                            <label class="form-label text-muted small text-uppercase fw-bold mb-1">Paying For Booking</label>
                            <input type="text" class="form-control form-control-lg bg-light fw-bold" th:field="*{bookingId}" readonly>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label fw-bold">Amount to Pay ($)</label>
                            <input type="number" step="0.01" class="form-control" th:field="*{amount}" required placeholder="e.g. 500.00">
                        </div>
                        
                        <div class="mb-4">
                            <label class="form-label fw-bold">Payment Method</label>
                            <select class="form-select" th:field="*{paymentMethod}" required>
                                <option value="" disabled selected>Select a secure method...</option>
                                <option value="CREDIT_CARD">Credit Card</option>
                                <option value="PAYPAL">PayPal</option>
                                <option value="BANK_TRANSFER">Bank Transfer</option>
                            </select>
                        </div>
                        
                        <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                            <a href="/bookings" class="btn btn-secondary px-3">Cancel</a>
                            <button type="submit" class="btn btn-success px-4 fw-bold shadow-sm">Confirm Payment</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
