<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Leave a Review</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="/reviews">Wedding Planner - Component 5</a>
    </div>
</nav>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-primary">
                <div class="card-header bg-primary text-white fw-bold">
                    <h4 class="mb-0">Leave a Vendor Review</h4>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/reviews/add}" th:object="${review}" method="post">
                        
                        <!-- AGGREGATION: Linking User -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">Select User (Reviewer)</label>
                            <select class="form-select" th:field="*{userId}" required>
                                <option value="" disabled selected>Choose your User ID...</option>
                                <option th:each="uId : ${userIds}" th:value="${uId}" th:text="${uId}"></option>
                            </select>
                        </div>
                        
                        <!-- AGGREGATION: Linking Vendor -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">Select Vendor</label>
                            <select class="form-select" th:field="*{vendorId}" required>
                                <option value="" disabled selected>Choose a Vendor...</option>
                                <option th:each="vendor : ${vendors}" th:value="${vendor.userId}" th:text="${vendor.businessName} + ' (' + ${vendor.category} + ')'"></option>
                            </select>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label fw-bold">Rating (Out of 5)</label>
                            <input type="number" min="1" max="5" class="form-control" th:field="*{rating}" required placeholder="1 to 5">
                        </div>
                        
                        <div class="mb-4">
                            <label class="form-label fw-bold">Comment</label>
                            <textarea class="form-control" th:field="*{comment}" rows="4" required placeholder="Share your experience..."></textarea>
                        </div>
                        
                        <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                            <a href="/reviews" class="btn btn-secondary px-3">Cancel</a>
                            <button type="submit" class="btn btn-primary px-4 fw-bold shadow-sm">Submit Review</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
