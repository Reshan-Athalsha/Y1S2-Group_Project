<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Vendor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="/vendors">Wedding Planner - Component 2</a>
    </div>
</nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm border-warning">
                <div class="card-header bg-warning text-dark">
                    <h4 class="mb-0">Edit Vendor Profile</h4>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/vendors/edit}" th:object="${vendor}" method="post">
                        
                        <!-- Hidden fields to preserve unchanged data during update -->
                        <input type="hidden" th:field="*{userId}">
                        <input type="hidden" th:field="*{password}">
                        <input type="hidden" th:field="*{role}">
                        
                        <h5 class="mb-3 text-muted border-bottom pb-2">User Account Details (ID: <span th:text="${vendor.userId}"></span>)</h5>
                        <div class="row mb-4">
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Full Name</label>
                                <input type="text" class="form-control" th:field="*{name}" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Email Address</label>
                                <input type="email" class="form-control" th:field="*{email}" required>
                            </div>
                        </div>

                        <h5 class="mb-3 text-muted border-bottom pb-2">Vendor Business Profile</h5>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Business Name</label>
                                <input type="text" class="form-control" th:field="*{businessName}" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Category</label>
                                <select class="form-select" th:field="*{category}" required>
                                    <option value="Photography">Photography</option>
                                    <option value="Catering">Catering</option>
                                    <option value="Venue">Venue</option>
                                    <option value="Decoration">Decoration</option>
                                    <option value="Music">Music</option>
                                    <option value="Makeup">Makeup</option>
                                </select>
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Price ($)</label>
                                <input type="number" step="0.01" class="form-control" th:field="*{price}" required>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-bold">Description</label>
                            <textarea class="form-control" th:field="*{description}" rows="4" required></textarea>
                        </div>
                        
                        <div class="d-flex justify-content-end gap-2">
                            <a href="/vendors" class="btn btn-secondary">Cancel</a>
                            <button type="submit" class="btn btn-warning px-4 text-dark fw-bold">Update Vendor</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
